<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 432 648" width="1800" height="2700">
<title>Mapa de influências</title>
<desc>Observe como a influência atua em uma relação concreta.</desc>
<rect x="0" y="0" width="432" height="648" rx="0" fill="#101010" stroke="none" stroke-width=".7"/>
<text x="30" y="29.0" fill="#E2BD78" font-size="8.1" font-family="DejaVu Sans" font-weight="700">MÉTODO POSICIONE-SE · SOL LIMA</text>
<text x="30" y="65.0" fill="#E2BD78" font-size="25" font-family="DejaVu Serif" font-weight="400">Mapa de influências</text>
<text x="30" y="84.0" fill="#C6BCA9" font-size="10.1" font-family="DejaVu Sans" font-weight="400">Observe como a influência atua em uma relação concreta.</text>
<line x1="30" y1="110" x2="402" y2="110" stroke="#725936" stroke-width="0.7"/>
<rect x="30" y="133" width="182" height="80" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="43" y="154.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">Pensamento</text>
<text x="43" y="171.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Posso pensar diferente e</text>
<text x="43" y="183.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">explicar por quê?</text>
<rect x="220" y="133" width="182" height="80" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="233" y="154.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">Informação</text>
<text x="233" y="171.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Posso consultar e comparar</text>
<text x="233" y="183.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">outras fontes?</text>
<rect x="30" y="223" width="182" height="80" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="43" y="244.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">Emoção</text>
<text x="43" y="261.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Culpa ou vergonha são usadas</text>
<text x="43" y="273.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">para me controlar?</text>
<rect x="220" y="223" width="182" height="80" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="233" y="244.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">Identidade</text>
<text x="233" y="261.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Posso preservar valores e uma</text>
<text x="233" y="273.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">voz própria?</text>
<rect x="30" y="313" width="182" height="80" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="43" y="334.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">Vínculos</text>
<text x="43" y="351.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Meus outros relacionamentos</text>
<text x="43" y="363.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">são restringidos?</text>
<rect x="220" y="313" width="182" height="80" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="233" y="334.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">Medo</text>
<text x="233" y="351.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Há ameaças ou punições para</text>
<text x="233" y="363.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">obter obediência?</text>
<rect x="30" y="403" width="182" height="80" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="43" y="424.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">Questionamento</text>
<text x="43" y="441.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Posso perguntar e discordar sem</text>
<text x="43" y="453.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">intimidação?</text>
<rect x="220" y="403" width="182" height="80" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="233" y="424.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">Saída</text>
<text x="233" y="441.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Posso me afastar? Quais riscos e</text>
<text x="233" y="453.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">dependências existem?</text>
<text x="30" y="518.0" fill="#E2BD78" font-size="10" font-family="DejaVu Sans" font-weight="700">REGISTRE: observei · não observei · ainda não sei</text>
<text x="30" y="544" fill="#F4EEE3" font-size="9.7" font-family="DejaVu Sans" font-weight="400">Anote um fato e uma explicação alternativa.</text>
<text x="30" y="558" fill="#F4EEE3" font-size="9.7" font-family="DejaVu Sans" font-weight="400">Concordar com alguém ou pertencer a um grupo, por si só,</text>
<text x="30" y="572" fill="#F4EEE3" font-size="9.7" font-family="DejaVu Sans" font-weight="400">não demonstra influência indevida.</text>
<line x1="30" y1="609" x2="402" y2="609" stroke="#725936" stroke-width="0.6"/>
<text x="30" y="626.0" fill="#C6BCA9" font-size="8" font-family="DejaVu Sans" font-weight="400">Roteiro de reflexão do Workbook. Não comprova “lavagem cerebral”.</text>
</svg>