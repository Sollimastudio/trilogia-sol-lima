<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 432 648" width="1800" height="2700">
<title>Alinhamento em prática</title>
<desc>A posição ganha consistência quando chega à conduta.</desc>
<rect x="0" y="0" width="432" height="648" rx="0" fill="#101010" stroke="none" stroke-width=".7"/>
<text x="30" y="29.0" fill="#E2BD78" font-size="8.1" font-family="DejaVu Sans" font-weight="700">MÉTODO POSICIONE-SE · SOL LIMA</text>
<text x="30" y="65.0" fill="#E2BD78" font-size="25" font-family="DejaVu Serif" font-weight="400">Alinhamento em prática</text>
<text x="30" y="84.0" fill="#C6BCA9" font-size="10.1" font-family="DejaVu Sans" font-weight="400">A posição ganha consistência quando chega à conduta.</text>
<line x1="30" y1="110" x2="402" y2="110" stroke="#725936" stroke-width="0.7"/>
<rect x="30" y="135" width="176" height="83" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="43" y="156.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">VALORES + LIMITES</text>
<text x="43" y="173.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">O que você considera</text>
<text x="43" y="185.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">importante e precisa sustentar?</text>
<rect x="226" y="135" width="176" height="83" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="239" y="156.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">FATOS + CONDIÇÕES</text>
<text x="239" y="173.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Que evidências, deveres,</text>
<text x="239" y="185.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">recursos e riscos existem?</text>
<line x1="118" y1="218" x2="118" y2="239" stroke="#E2BD78" stroke-width="1"/>
<line x1="314" y1="218" x2="314" y2="239" stroke="#E2BD78" stroke-width="1"/>
<line x1="118" y1="239" x2="314" y2="239" stroke="#E2BD78" stroke-width="1"/>
<line x1="216" y1="239" x2="216" y2="258" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="258" x2="213.3865638553467" y2="253.73737738970246" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="258" x2="218.6134361446533" y2="253.73737738970246" stroke="#E2BD78" stroke-width="1.1"/>
<rect x="66" y="258" width="300" height="65" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="79" y="279.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">FILTRO DA SENSATEZ</text>
<text x="79" y="296.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Examine a leitura e o movimento pretendido.</text>
<line x1="216" y1="323" x2="216" y2="344" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="344" x2="213.3865638553467" y2="339.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="344" x2="218.6134361446533" y2="339.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<rect x="66" y="344" width="300" height="65" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="79" y="365.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">DECISÃO + PRÁTICA</text>
<text x="79" y="382.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">O que fará? Como comunicará? Que acordo precisa</text>
<text x="79" y="394.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">existir?</text>
<line x1="216" y1="409" x2="216" y2="430" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="430" x2="213.3865638553467" y2="425.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="430" x2="218.6134361446533" y2="425.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<rect x="66" y="430" width="300" height="65" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="79" y="451.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">FRUTOS + REVISÃO</text>
<text x="79" y="468.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">A conduta se aproximou dos valores? O que ajustar?</text>
<line x1="366" y1="464" x2="415" y2="464" stroke="#E2BD78" stroke-width="1"/>
<line x1="415" y1="464" x2="415" y2="286" stroke="#E2BD78" stroke-width="1"/>
<line x1="415" y1="286" x2="366" y2="286" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="366" y1="286" x2="370.2626226102975" y2="283.3865638553467" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="366" y1="286" x2="370.2626226102975" y2="288.6134361446533" stroke="#E2BD78" stroke-width="1.1"/>
<text x="30" y="558.0" fill="#F4EEE3" font-size="10" font-family="DejaVu Sans" font-weight="400">O Tronco sustenta a prática nos diferentes Galhos.</text>
<text x="30" y="571.0" fill="#F4EEE3" font-size="10" font-family="DejaVu Sans" font-weight="400">Rever uma decisão diante de evidência também é coerência.</text>
<line x1="30" y1="609" x2="402" y2="609" stroke="#725936" stroke-width="0.6"/>
<text x="30" y="626.0" fill="#C6BCA9" font-size="8" font-family="DejaVu Sans" font-weight="400">O Filtro examina a interpretação; não é apenas outro nome para ela.</text>
