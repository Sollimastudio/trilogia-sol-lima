<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 432 648" width="1800" height="2700">
<title>A Jaula e o Sofá</title>
<desc>Uma metáfora da experiência da autora.</desc>
<rect x="0" y="0" width="432" height="648" rx="0" fill="#101010" stroke="none" stroke-width=".7"/>
<text x="30" y="29.0" fill="#E2BD78" font-size="8.1" font-family="DejaVu Sans" font-weight="700">MÉTODO POSICIONE-SE · SOL LIMA</text>
<text x="30" y="65.0" fill="#E2BD78" font-size="25" font-family="DejaVu Serif" font-weight="400">A Jaula e o Sofá</text>
<text x="30" y="84.0" fill="#C6BCA9" font-size="10.1" font-family="DejaVu Sans" font-weight="400">Uma metáfora da experiência da autora.</text>
<line x1="30" y1="110" x2="402" y2="110" stroke="#725936" stroke-width="0.7"/>
<image x="106.0" y="120.0" width="220.0" height="330.0" xlink:href="../ARTES/jaula_sofa_cor.png"/>
<text x="30" y="481" fill="#E2BD78" font-size="12" font-family="DejaVu Sans" font-weight="700">Que história mantém você no mesmo lugar?</text>
<text x="30" y="508" fill="#F4EEE3" font-size="10" font-family="DejaVu Sans" font-weight="400">Na história de Sol, a porta estava aberta e o Sofá oferecia</text>
<text x="30" y="522" fill="#F4EEE3" font-size="10" font-family="DejaVu Sans" font-weight="400">um conforto conhecido. Examine a sua situação concreta:</text>
<text x="30" y="536" fill="#F4EEE3" font-size="10" font-family="DejaVu Sans" font-weight="400">qual porta existe e de que condição você precisa para sair?</text>
<line x1="30" y1="609" x2="402" y2="609" stroke="#725936" stroke-width="0.6"/>
<text x="30" y="626.0" fill="#C6BCA9" font-size="8" font-family="DejaVu Sans" font-weight="400">A porta possível depende também de recursos, apoio e segurança.</text>
</svg>