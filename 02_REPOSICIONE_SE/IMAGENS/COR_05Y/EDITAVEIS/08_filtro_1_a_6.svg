<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 432 648" width="1800" height="2700">
<title>Filtro da Sensatez · 1</title>
<desc>Primeiro, examine a leitura da situação.</desc>
<rect x="0" y="0" width="432" height="648" rx="0" fill="#101010" stroke="none" stroke-width=".7"/>
<text x="30" y="29.0" fill="#E2BD78" font-size="8.1" font-family="DejaVu Sans" font-weight="700">MÉTODO POSICIONE-SE · SOL LIMA</text>
<text x="30" y="65.0" fill="#E2BD78" font-size="25" font-family="DejaVu Serif" font-weight="400">Filtro da Sensatez · 1</text>
<text x="30" y="84.0" fill="#C6BCA9" font-size="10.1" font-family="DejaVu Sans" font-weight="400">Primeiro, examine a leitura da situação.</text>
<line x1="30" y1="110" x2="402" y2="110" stroke="#725936" stroke-width="0.7"/>
<rect x="30" y="131.0" width="372" height="66.0" rx="5" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<circle cx="49" cy="151.0" r="10" fill="#32191D" stroke="#E2BD78"/>
<text x="46" y="154.0" fill="#E2BD78" font-size="8" font-family="DejaVu Sans" font-weight="700">1</text>
<text x="68" y="151.0" fill="#E2BD78" font-size="10.3" font-family="DejaVu Sans" font-weight="700">Qual é o fato observável?</text>
<rect x="30" y="205.0" width="372" height="66.0" rx="5" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<circle cx="49" cy="225.0" r="10" fill="#32191D" stroke="#E2BD78"/>
<text x="46" y="228.0" fill="#E2BD78" font-size="8" font-family="DejaVu Sans" font-weight="700">2</text>
<text x="68" y="225.0" fill="#E2BD78" font-size="10.3" font-family="DejaVu Sans" font-weight="700">Qual é a minha interpretação?</text>
<rect x="30" y="279.0" width="372" height="66.0" rx="5" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<circle cx="49" cy="299.0" r="10" fill="#32191D" stroke="#E2BD78"/>
<text x="46" y="302.0" fill="#E2BD78" font-size="8" font-family="DejaVu Sans" font-weight="700">3</text>
<text x="68" y="299.0" fill="#E2BD78" font-size="10.3" font-family="DejaVu Sans" font-weight="700">O que minha emoção informa — e o que não prova?</text>
<rect x="30" y="353.0" width="372" height="66.0" rx="5" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<circle cx="49" cy="373.0" r="10" fill="#32191D" stroke="#E2BD78"/>
<text x="46" y="376.0" fill="#E2BD78" font-size="8" font-family="DejaVu Sans" font-weight="700">4</text>
<text x="68" y="373.0" fill="#E2BD78" font-size="10.3" font-family="DejaVu Sans" font-weight="700">Que evidências sustentam e contradizem minha</text>
<text x="68" y="386.0" fill="#E2BD78" font-size="10.3" font-family="DejaVu Sans" font-weight="700">leitura?</text>
<rect x="30" y="427.0" width="372" height="66.0" rx="5" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<circle cx="49" cy="447.0" r="10" fill="#32191D" stroke="#E2BD78"/>
<text x="46" y="450.0" fill="#E2BD78" font-size="8" font-family="DejaVu Sans" font-weight="700">5</text>
<text x="68" y="447.0" fill="#E2BD78" font-size="10.3" font-family="DejaVu Sans" font-weight="700">Há premissa escondida, salto lógico ou inversão</text>
<text x="68" y="460.0" fill="#E2BD78" font-size="10.3" font-family="DejaVu Sans" font-weight="700">moral?</text>
<rect x="30" y="501.0" width="372" height="66.0" rx="5" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<circle cx="49" cy="521.0" r="10" fill="#32191D" stroke="#E2BD78"/>
<text x="46" y="524.0" fill="#E2BD78" font-size="8" font-family="DejaVu Sans" font-weight="700">6</text>
<text x="68" y="521.0" fill="#E2BD78" font-size="10.3" font-family="DejaVu Sans" font-weight="700">Minha régua continuaria igual com os papéis</text>
<text x="68" y="534.0" fill="#E2BD78" font-size="10.3" font-family="DejaVu Sans" font-weight="700">trocados?</text>
<line x1="30" y1="609" x2="402" y2="609" stroke="#725936" stroke-width="0.6"/>
<text x="30" y="626.0" fill="#C6BCA9" font-size="8" font-family="DejaVu Sans" font-weight="400">Registre o que sabe, o que infere e o que ainda não sabe.</text>
</svg>