<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 432 648" width="1800" height="2700">
<title>Um Tronco, vários Galhos</title>
<desc>Investigue a área em que a posição aparece.</desc>
<rect x="0" y="0" width="432" height="648" rx="0" fill="#101010" stroke="none" stroke-width=".7"/>
<text x="30" y="29.0" fill="#E2BD78" font-size="8.1" font-family="DejaVu Sans" font-weight="700">MÉTODO POSICIONE-SE · SOL LIMA</text>
<text x="30" y="65.0" fill="#E2BD78" font-size="25" font-family="DejaVu Serif" font-weight="400">Um Tronco, vários Galhos</text>
<text x="30" y="84.0" fill="#C6BCA9" font-size="10.1" font-family="DejaVu Sans" font-weight="400">Investigue a área em que a posição aparece.</text>
<line x1="30" y1="110" x2="402" y2="110" stroke="#725936" stroke-width="0.7"/>
<rect x="92" y="132" width="248" height="70" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="105" y="153.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">TRONCO</text>
<text x="105" y="170.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Valores, limites e acordos que você sustenta</text>
<text x="105" y="182.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">na prática.</text>
<line x1="216" y1="202" x2="216" y2="222" stroke="#E2BD78" stroke-width="1"/>
<line x1="119" y1="222" x2="309" y2="222" stroke="#E2BD78" stroke-width="1"/>
<line x1="119" y1="222" x2="119" y2="241" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="119" y1="241" x2="116.38656385534671" y2="236.73737738970246" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="119" y1="241" x2="121.61343614465329" y2="236.73737738970246" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="309" y1="222" x2="309" y2="241" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="309" y1="241" x2="306.3865638553467" y2="236.73737738970246" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="309" y1="241" x2="311.6134361446533" y2="236.73737738970246" stroke="#E2BD78" stroke-width="1.1"/>
<rect x="30" y="241" width="182" height="71" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="43" y="262.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">Vínculos</text>
<text x="43" y="279.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Amor, família e convivência.</text>
<rect x="220" y="241" width="182" height="71" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="233" y="262.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">Trabalho</text>
<text x="233" y="279.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Carreira e marca pessoal.</text>
<rect x="30" y="324" width="182" height="71" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="43" y="345.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">Dinheiro</text>
<text x="43" y="362.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Compromissos e escolhas.</text>
<rect x="220" y="324" width="182" height="71" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="233" y="345.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">Fé e corpo</text>
<text x="233" y="362.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Convicções e autocuidado.</text>
<rect x="30" y="407" width="182" height="71" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="43" y="428.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">Vida pública</text>
<text x="43" y="445.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Participação e política.</text>
<rect x="220" y="407" width="182" height="71" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="233" y="428.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">Redes</text>
<text x="233" y="445.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Presença e relações digitais.</text>
<text x="30" y="522.0" fill="#E2BD78" font-size="11" font-family="DejaVu Sans" font-weight="700">UMA ÁREA NÃO É A VIDA INTEIRA</text>
<text x="30" y="548" fill="#F4EEE3" font-size="10" font-family="DejaVu Sans" font-weight="400">Uma pessoa pode sustentar limites no trabalho e ter</text>
<text x="30" y="562" fill="#F4EEE3" font-size="10" font-family="DejaVu Sans" font-weight="400">dificuldade de praticá-los na família. Escolha um Galho,</text>
<text x="30" y="576" fill="#F4EEE3" font-size="10" font-family="DejaVu Sans" font-weight="400">uma situação e um período para começar.</text>
<line x1="30" y1="609" x2="402" y2="609" stroke="#725936" stroke-width="0.6"/>
<text x="30" y="626.0" fill="#C6BCA9" font-size="8" font-family="DejaVu Sans" font-weight="400">Áreas exemplificativas. Preserve o que já funciona em cada Galho.</text>
