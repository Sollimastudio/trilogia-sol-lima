<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 432 648" width="1800" height="2700">
<title>Como um padrão se repete</title>
<desc>Encontre um ponto de intervenção na situação concreta.</desc>
<rect x="0" y="0" width="432" height="648" rx="0" fill="#101010" stroke="none" stroke-width=".7"/>
<text x="30" y="29.0" fill="#E2BD78" font-size="8.1" font-family="DejaVu Sans" font-weight="700">MÉTODO POSICIONE-SE · SOL LIMA</text>
<text x="30" y="65.0" fill="#E2BD78" font-size="25" font-family="DejaVu Serif" font-weight="400">Como um padrão se repete</text>
<text x="30" y="84.0" fill="#C6BCA9" font-size="10.1" font-family="DejaVu Sans" font-weight="400">Encontre um ponto de intervenção na situação concreta.</text>
<line x1="30" y1="110" x2="402" y2="110" stroke="#725936" stroke-width="0.7"/>
<rect x="66" y="133" width="300" height="62" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="79" y="154.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">SITUAÇÃO + CONDIÇÕES</text>
<text x="79" y="171.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">O que ocorreu? Que recursos e restrições havia?</text>
<line x1="216" y1="195" x2="216" y2="211" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="211" x2="213.3865638553467" y2="206.73737738970246" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="211" x2="218.6134361446533" y2="206.73737738970246" stroke="#E2BD78" stroke-width="1.1"/>
<rect x="66" y="211" width="300" height="62" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="79" y="232.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">LEITURA + EMOÇÃO</text>
<text x="79" y="249.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">O que pensei? O que senti? O que pressupus?</text>
<line x1="216" y1="273" x2="216" y2="289" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="289" x2="213.3865638553467" y2="284.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="289" x2="218.6134361446533" y2="284.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<rect x="66" y="291" width="300" height="62" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="79" y="312.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">RESPOSTA HABITUAL</text>
<text x="79" y="329.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">O que fiz, permiti, adiei ou repeti?</text>
<line x1="216" y1="353" x2="216" y2="369" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="369" x2="213.3865638553467" y2="364.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="369" x2="218.6134361446533" y2="364.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<rect x="66" y="371" width="300" height="62" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="79" y="392.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">FRUTO OBSERVADO</text>
<text x="79" y="409.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">O resultado reforçou ou contrariou minha leitura?</text>
<line x1="66" y1="402" x2="18" y2="402" stroke="#E2BD78" stroke-width="1"/>
<line x1="18" y1="402" x2="18" y2="241" stroke="#E2BD78" stroke-width="1"/>
<line x1="18" y1="241" x2="66" y2="241" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="66" y1="241" x2="61.73737738970247" y2="243.6134361446533" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="66" y1="241" x2="61.73737738970247" y2="238.3865638553467" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="433" x2="216" y2="457" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="457" x2="213.3865638553467" y2="452.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="457" x2="218.6134361446533" y2="452.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<rect x="30" y="457" width="372" height="74" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="43" y="478.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">SUBA AO MIRANTE</text>
<text x="43" y="495.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Examine como pensou. Busque evidência e outra leitura.</text>
<text x="43" y="507.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Escolha uma resposta possível e reveja o resultado.</text>
<text x="30" y="568.0" fill="#F4EEE3" font-size="10" font-family="DejaVu Sans" font-weight="400">Repetição é uma pista para investigar.</text>
<text x="30" y="581.0" fill="#F4EEE3" font-size="10" font-family="DejaVu Sans" font-weight="400">Não prova que a causa esteja sempre dentro de você.</text>
<line x1="30" y1="609" x2="402" y2="609" stroke="#725936" stroke-width="0.6"/>
<text x="30" y="626.0" fill="#C6BCA9" font-size="8" font-family="DejaVu Sans" font-weight="400">Metacognição: observar, examinar e ajustar o próprio pensamento.</text>
</svg>