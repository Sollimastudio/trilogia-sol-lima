<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 432 648" width="1800" height="2700">
<title>A dor e o próximo passo</title>
<desc>Reconhecer o sofrimento pode abrir espaço para o cuidado.</desc>
<rect x="0" y="0" width="432" height="648" rx="0" fill="#101010" stroke="none" stroke-width=".7"/>
<text x="30" y="29.0" fill="#E2BD78" font-size="8.1" font-family="DejaVu Sans" font-weight="700">MÉTODO POSICIONE-SE · SOL LIMA</text>
<text x="30" y="65.0" fill="#E2BD78" font-size="25" font-family="DejaVu Serif" font-weight="400">A dor e o próximo passo</text>
<text x="30" y="84.0" fill="#C6BCA9" font-size="10.1" font-family="DejaVu Sans" font-weight="400">Reconhecer o sofrimento pode abrir espaço para o cuidado.</text>
<line x1="30" y1="110" x2="402" y2="110" stroke="#725936" stroke-width="0.7"/>
<image x="159.33333333333334" y="120.0" width="113.33333333333333" height="170.0" xlink:href="../ARTES/autopiedade_base_cor.png"/>
<rect x="30" y="314" width="181" height="164" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="43" y="335.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">AUTOPIEDADE</text>
<text x="43" y="352.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">A dor ocupa toda a leitura e</text>
<text x="43" y="364.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">apaga o movimento possível.</text>
<text x="43" y="377.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400"></text>
<text x="43" y="389.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Pergunta de exame:</text>
<text x="43" y="402.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Estou transformando o que sofri</text>
<text x="43" y="414.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">na única explicação para o que</text>
<text x="43" y="427.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">posso fazer?</text>
<rect x="221" y="314" width="181" height="164" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="234" y="335.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">AUTOCOMPAIXÃO</text>
<text x="234" y="352.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">A dor é reconhecida junto das</text>
<text x="234" y="364.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">necessidades, dos limites e do</text>
<text x="234" y="377.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">cuidado possível.</text>
<text x="234" y="389.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400"></text>
<text x="234" y="402.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Pergunta de cuidado:</text>
<text x="234" y="414.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Do que preciso para dar o</text>
<text x="234" y="427.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">próximo passo?</text>
<text x="30" y="515.0" fill="#E2BD78" font-size="10" font-family="DejaVu Sans" font-weight="400">Na experiência de Sol Lima, a autopiedade foi a praga</text>
<text x="30" y="528.0" fill="#E2BD78" font-size="10" font-family="DejaVu Sans" font-weight="400">mais prejudicial. Essa prioridade nasce da sua história.</text>
<text x="30" y="561.0" fill="#F4EEE3" font-size="9.6" font-family="DejaVu Sans" font-weight="400">Precisar de tempo, apoio ou proteção não é autopiedade.</text>
<text x="30" y="573.48" fill="#F4EEE3" font-size="9.6" font-family="DejaVu Sans" font-weight="400">Acolher a dor e assumir responsabilidade podem coexistir.</text>
<line x1="30" y1="609" x2="402" y2="609" stroke="#725936" stroke-width="0.6"/>
<text x="30" y="626.0" fill="#C6BCA9" font-size="8" font-family="DejaVu Sans" font-weight="400">A metáfora examina um mecanismo; não diminui a pessoa que sofre.</text>
</svg>