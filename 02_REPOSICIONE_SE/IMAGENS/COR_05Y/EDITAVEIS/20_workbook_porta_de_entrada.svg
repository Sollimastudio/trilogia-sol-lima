<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 432 648" width="1800" height="2700">
<title>Do livro ao Workbook</title>
<desc>Três instrumentos para registrar e examinar situações.</desc>
<rect x="0" y="0" width="432" height="648" rx="0" fill="#101010" stroke="none" stroke-width=".7"/>
<text x="30" y="29.0" fill="#E2BD78" font-size="8.1" font-family="DejaVu Sans" font-weight="700">MÉTODO POSICIONE-SE · SOL LIMA</text>
<text x="30" y="65.0" fill="#E2BD78" font-size="25" font-family="DejaVu Serif" font-weight="400">Do livro ao Workbook</text>
<text x="30" y="84.0" fill="#C6BCA9" font-size="10.1" font-family="DejaVu Sans" font-weight="400">Três instrumentos para registrar e examinar situações.</text>
<line x1="30" y1="110" x2="402" y2="110" stroke="#725936" stroke-width="0.7"/>
<rect x="30" y="135" width="372" height="85" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="43" y="156.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">TESTE DO POSICIONAMENTO</text>
<text x="43" y="173.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Observe os 14 Espelhos numa área da vida e escolha até dois para</text>
<text x="43" y="185.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">investigar.</text>
<rect x="30" y="238" width="372" height="85" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="43" y="259.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">TESTE DA ÁRVORE</text>
<text x="43" y="276.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Localize o Fruto, diferencie as partes da Árvore e examine as condições</text>
<text x="43" y="288.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">externas.</text>
<rect x="30" y="341" width="372" height="85" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="43" y="362.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">TESTE DE INFLUÊNCIA INDEVIDA</text>
<text x="43" y="379.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Examine autonomia, formas de pressão e liberdade real numa relação</text>
<text x="43" y="391.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">específica.</text>
<rect x="30" y="461" width="372" height="73" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="43" y="482.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">FICHA COMPLEMENTAR · AUTOPIEDADE</text>
<text x="43" y="499.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">A ficha F17 aprofunda o exame da autopiedade.</text>
<text x="43" y="511.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Ela não constitui um quarto teste obrigatório.</text>
<text x="30" y="570.0" fill="#F4EEE3" font-size="9.5" font-family="DejaVu Sans" font-weight="400">Registre um fato, uma hipótese, um passo e uma revisão.</text>
<text x="30" y="582.35" fill="#F4EEE3" font-size="9.5" font-family="DejaVu Sans" font-weight="400">O livro oferece a travessia; o Workbook organiza o registro.</text>
<line x1="30" y1="609" x2="402" y2="609" stroke="#725936" stroke-width="0.6"/>
<text x="30" y="626.0" fill="#C6BCA9" font-size="8" font-family="DejaVu Sans" font-weight="400">Instrumentos de reflexão autoral em versão editorial 0.1.</text>
</svg>