<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 432 648" width="1800" height="2700">
<title>Poda e nova Semente</title>
<desc>Uma mudança específica que possa chegar à prática.</desc>
<rect x="0" y="0" width="432" height="648" rx="0" fill="#101010" stroke="none" stroke-width=".7"/>
<text x="30" y="29.0" fill="#E2BD78" font-size="8.1" font-family="DejaVu Sans" font-weight="700">MÉTODO POSICIONE-SE · SOL LIMA</text>
<text x="30" y="65.0" fill="#E2BD78" font-size="25" font-family="DejaVu Serif" font-weight="400">Poda e nova Semente</text>
<text x="30" y="84.0" fill="#C6BCA9" font-size="10.1" font-family="DejaVu Sans" font-weight="400">Uma mudança específica que possa chegar à prática.</text>
<line x1="30" y1="110" x2="402" y2="110" stroke="#725936" stroke-width="0.7"/>
<image x="106.0" y="120.0" width="220.0" height="330.0" xlink:href="../ARTES/poda_semente_cor.png"/>
<text x="30" y="481" fill="#E2BD78" font-size="12" font-family="DejaVu Sans" font-weight="700">O que interromper? O que praticar no lugar?</text>
<text x="30" y="508" fill="#F4EEE3" font-size="10" font-family="DejaVu Sans" font-weight="400">Escolha uma resposta, exposição ou permissão a ajustar.</text>
<text x="30" y="522" fill="#F4EEE3" font-size="10" font-family="DejaVu Sans" font-weight="400">Plante uma atitude observável e defina quando avaliar</text>
<text x="30" y="536" fill="#F4EEE3" font-size="10" font-family="DejaVu Sans" font-weight="400">os frutos. Preserve o que já funciona.</text>
<line x1="30" y1="609" x2="402" y2="609" stroke="#725936" stroke-width="0.6"/>
<text x="30" y="626.0" fill="#C6BCA9" font-size="8" font-family="DejaVu Sans" font-weight="400">Poda não é uma ordem para retirar pessoas da sua vida.</text>
</svg>