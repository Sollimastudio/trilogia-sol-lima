<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 432 648" width="1800" height="2700">
<title>O que você está investigando?</title>
<desc>Quatro conceitos que precisam permanecer distintos.</desc>
<rect x="0" y="0" width="432" height="648" rx="0" fill="#101010" stroke="none" stroke-width=".7"/>
<text x="30" y="29.0" fill="#E2BD78" font-size="8.1" font-family="DejaVu Sans" font-weight="700">MÉTODO POSICIONE-SE · SOL LIMA</text>
<text x="30" y="65.0" fill="#E2BD78" font-size="24.0" font-family="DejaVu Serif" font-weight="400">O que você está investigando?</text>
<text x="30" y="84.0" fill="#C6BCA9" font-size="10.1" font-family="DejaVu Sans" font-weight="400">Quatro conceitos que precisam permanecer distintos.</text>
<line x1="30" y1="110" x2="402" y2="110" stroke="#725936" stroke-width="0.7"/>
<rect x="30" y="132" width="372" height="75" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="43" y="153.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">SEMENTE · atitude plantada</text>
<text x="43" y="170.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">O que eu efetivamente fiz, decidi ou pratiquei?</text>
<rect x="30" y="221" width="372" height="75" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="43" y="242.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">SOLO · modo operante</text>
<text x="43" y="259.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Como recebo, interpreto e respondo ao que acontece?</text>
<rect x="30" y="310" width="372" height="75" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="43" y="331.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">RAÍZES · sustentação aprendida</text>
<text x="43" y="348.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Que crença, hábito ou lealdade sustenta minha resposta?</text>
<rect x="30" y="399" width="372" height="75" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="43" y="420.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">AMBIENTE · condições externas</text>
<text x="43" y="437.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Que regras, recursos, pressões ou restrições interferem?</text>
<rect x="30" y="508" width="372" height="85" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="43" y="530.0" fill="#E2BD78" font-size="10.5" font-family="DejaVu Sans" font-weight="700">INVESTIGUE A COMBINAÇÃO</text>
<text x="43" y="548.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Um mesmo resultado pode envolver prática, modo operante,</text>
<text x="43" y="560.22" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">aprendizagens e condições externas. Registre o que sabe</text>
<text x="43" y="572.44" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">e o que ainda precisa verificar.</text>
<line x1="30" y1="609" x2="402" y2="609" stroke="#725936" stroke-width="0.6"/>
<text x="30" y="626.0" fill="#C6BCA9" font-size="8" font-family="DejaVu Sans" font-weight="400">A analogia autoral se inspira na Parábola do Semeador.</text>
</svg>