<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 432 648" width="1800" height="2700">
<title>Da percepção à prática</title>
<desc>Um percurso para trabalhar uma situação real.</desc>
<rect x="0" y="0" width="432" height="648" rx="0" fill="#101010" stroke="none" stroke-width=".7"/>
<text x="30" y="29.0" fill="#E2BD78" font-size="8.1" font-family="DejaVu Sans" font-weight="700">MÉTODO POSICIONE-SE · SOL LIMA</text>
<text x="30" y="65.0" fill="#E2BD78" font-size="25" font-family="DejaVu Serif" font-weight="400">Da percepção à prática</text>
<text x="30" y="84.0" fill="#C6BCA9" font-size="10.1" font-family="DejaVu Sans" font-weight="400">Um percurso para trabalhar uma situação real.</text>
<line x1="30" y1="110" x2="402" y2="110" stroke="#725936" stroke-width="0.7"/>
<rect x="66" y="132" width="300" height="54" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="79" y="153.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">1 OBSERVE UM FRUTO</text>
<text x="79" y="170.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Descreva o resultado, o Galho e o período.</text>
<line x1="216" y1="186" x2="216" y2="205" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="205" x2="213.3865638553467" y2="200.73737738970246" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="205" x2="218.6134361446533" y2="200.73737738970246" stroke="#E2BD78" stroke-width="1.1"/>
<rect x="66" y="205" width="300" height="59" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="79" y="226.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">2 INVESTIGUE A ÁRVORE E O AMBIENTE</text>
<text x="79" y="243.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Separe fatos, hipóteses, recursos e restrições.</text>
<line x1="216" y1="264" x2="216" y2="283" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="283" x2="213.3865638553467" y2="278.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="283" x2="218.6134361446533" y2="278.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<rect x="66" y="283" width="300" height="67" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="79" y="304.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">3 PASSE PELO FILTRO</text>
<text x="79" y="321.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">O que sustenta e contradiz sua leitura?</text>
<text x="79" y="333.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Há condições para um movimento possível?</text>
<line x1="216" y1="350" x2="216" y2="363" stroke="#E2BD78" stroke-width="1"/>
<line x1="116" y1="363" x2="316" y2="363" stroke="#E2BD78" stroke-width="1"/>
<line x1="116" y1="363" x2="116" y2="383" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="116" y1="383" x2="113.38656385534671" y2="378.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="116" y1="383" x2="118.61343614465329" y2="378.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="316" y1="363" x2="316" y2="383" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="316" y1="383" x2="313.3865638553467" y2="378.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="316" y1="383" x2="318.6134361446533" y2="378.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<rect x="30" y="383" width="178" height="79" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="43" y="404.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">SIM: PRATIQUE</text>
<text x="43" y="421.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Converse, ajuste um acordo,</text>
<text x="43" y="433.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">faça uma Poda específica ou</text>
<text x="43" y="446.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">plante uma nova atitude.</text>
<rect x="224" y="383" width="178" height="79" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="237" y="404.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">AINDA NÃO: PREPARE</text>
<text x="237" y="421.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Busque informação, recurso ou</text>
<text x="237" y="433.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">apoio. Defina o que falta e</text>
<text x="237" y="446.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">quando revisar.</text>
<line x1="116" y1="462" x2="116" y2="480" stroke="#E2BD78" stroke-width="1"/>
<line x1="316" y1="462" x2="316" y2="480" stroke="#E2BD78" stroke-width="1"/>
<line x1="116" y1="480" x2="316" y2="480" stroke="#E2BD78" stroke-width="1"/>
<line x1="216" y1="480" x2="216" y2="497" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="497" x2="213.3865638553467" y2="492.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="497" x2="218.6134361446533" y2="492.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<rect x="66" y="497" width="300" height="60" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="79" y="518.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">4 REVEJA OS FRUTOS</text>
<text x="79" y="535.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">O que mudou? O que manter? O que ajustar?</text>
<text x="79" y="547.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Compare o resultado com o registro inicial.</text>
<line x1="66" y1="529" x2="17" y2="529" stroke="#E2BD78" stroke-width="1"/>
<line x1="17" y1="529" x2="17" y2="158" stroke="#E2BD78" stroke-width="1"/>
<line x1="17" y1="158" x2="66" y2="158" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="66" y1="158" x2="61.73737738970247" y2="160.6134361446533" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="66" y1="158" x2="61.73737738970247" y2="155.3865638553467" stroke="#E2BD78" stroke-width="1.1"/>
<text x="45" y="588.0" fill="#E2BD78" font-size="10.1" font-family="DejaVu Sans" font-weight="400">Cada volta incorpora experiência e novos dados.</text>
<line x1="30" y1="609" x2="402" y2="609" stroke="#725936" stroke-width="0.6"/>
<text x="30" y="626.0" fill="#C6BCA9" font-size="8" font-family="DejaVu Sans" font-weight="400">Preparar condições também é uma ação do método.</text>
</svg>