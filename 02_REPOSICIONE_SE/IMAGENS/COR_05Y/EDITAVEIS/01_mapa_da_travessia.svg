<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 432 648" width="1800" height="2700">
<title>Mapa da travessia</title>
<desc>Sete Partes para transformar percepção em prática.</desc>
<rect x="0" y="0" width="432" height="648" rx="0" fill="#101010" stroke="none" stroke-width=".7"/>
<text x="30" y="29.0" fill="#E2BD78" font-size="8.1" font-family="DejaVu Sans" font-weight="700">MÉTODO POSICIONE-SE · SOL LIMA</text>
<text x="30" y="65.0" fill="#E2BD78" font-size="25" font-family="DejaVu Serif" font-weight="400">Mapa da travessia</text>
<text x="30" y="84.0" fill="#C6BCA9" font-size="10.1" font-family="DejaVu Sans" font-weight="400">Sete Partes para transformar percepção em prática.</text>
<line x1="30" y1="110" x2="402" y2="110" stroke="#725936" stroke-width="0.7"/>
<rect x="54" y="130" width="348" height="54" rx="5" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<circle cx="30" cy="150" r="13" fill="#32191D" stroke="#E2BD78"/>
<text x="23" y="154.0" fill="#E2BD78" font-size="9" font-family="DejaVu Sans" font-weight="700">I</text>
<text x="68" y="149.0" fill="#E2BD78" font-size="11.1" font-family="DejaVu Sans" font-weight="700">Reconheça sua posição</text>
<text x="68" y="165.0" fill="#F4EEE3" font-size="9.1" font-family="DejaVu Sans" font-weight="400">Que fruto se repete? O que acontece de fato?</text>
<text x="68" y="177.0" fill="#C6BCA9" font-size="7.5" font-family="DejaVu Sans" font-weight="400">Cap. 1–4</text>
<line x1="30" y1="164" x2="30" y2="178" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="30" y1="178" x2="27.386563855346704" y2="173.73737738970246" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="30" y1="178" x2="32.61343614465329" y2="173.73737738970246" stroke="#E2BD78" stroke-width="1.1"/>
<rect x="54" y="192" width="348" height="54" rx="5" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<circle cx="30" cy="212" r="13" fill="#32191D" stroke="#E2BD78"/>
<text x="23" y="216.0" fill="#E2BD78" font-size="9" font-family="DejaVu Sans" font-weight="700">II</text>
<text x="68" y="211.0" fill="#E2BD78" font-size="11.1" font-family="DejaVu Sans" font-weight="700">Investigue o cultivo</text>
<text x="68" y="227.0" fill="#F4EEE3" font-size="9.1" font-family="DejaVu Sans" font-weight="400">Semente, Solo e Raízes: o que você planta e sustenta?</text>
<text x="68" y="239.0" fill="#C6BCA9" font-size="7.5" font-family="DejaVu Sans" font-weight="400">Cap. 5–8</text>
<line x1="30" y1="226" x2="30" y2="240" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="30" y1="240" x2="27.386563855346704" y2="235.73737738970246" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="30" y1="240" x2="32.61343614465329" y2="235.73737738970246" stroke="#E2BD78" stroke-width="1.1"/>
<rect x="54" y="254" width="348" height="54" rx="5" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<circle cx="30" cy="274" r="13" fill="#32191D" stroke="#E2BD78"/>
<text x="19" y="278.0" fill="#E2BD78" font-size="9" font-family="DejaVu Sans" font-weight="700">III</text>
<text x="68" y="273.0" fill="#E2BD78" font-size="11.1" font-family="DejaVu Sans" font-weight="700">Fortaleça o Tronco</text>
<text x="68" y="289.0" fill="#F4EEE3" font-size="9.1" font-family="DejaVu Sans" font-weight="400">Que valores, limites e acordos você pratica?</text>
<text x="68" y="301.0" fill="#C6BCA9" font-size="7.5" font-family="DejaVu Sans" font-weight="400">Cap. 9–12</text>
<line x1="30" y1="288" x2="30" y2="302" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="30" y1="302" x2="27.386563855346704" y2="297.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="30" y1="302" x2="32.61343614465329" y2="297.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<rect x="54" y="316" width="348" height="54" rx="5" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<circle cx="30" cy="336" r="13" fill="#32191D" stroke="#E2BD78"/>
<text x="23" y="340.0" fill="#E2BD78" font-size="9" font-family="DejaVu Sans" font-weight="700">IV</text>
<text x="68" y="335.0" fill="#E2BD78" font-size="11.1" font-family="DejaVu Sans" font-weight="700">Observe os Galhos</text>
<text x="68" y="351.0" fill="#F4EEE3" font-size="9.1" font-family="DejaVu Sans" font-weight="400">Em quais áreas da vida isso aparece?</text>
<text x="68" y="363.0" fill="#C6BCA9" font-size="7.5" font-family="DejaVu Sans" font-weight="400">Cap. 13–16</text>
<line x1="30" y1="350" x2="30" y2="364" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="30" y1="364" x2="27.386563855346704" y2="359.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="30" y1="364" x2="32.61343614465329" y2="359.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<rect x="54" y="378" width="348" height="54" rx="5" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<circle cx="30" cy="398" r="13" fill="#32191D" stroke="#E2BD78"/>
<text x="23" y="402.0" fill="#E2BD78" font-size="9" font-family="DejaVu Sans" font-weight="700">V</text>
<text x="68" y="397.0" fill="#E2BD78" font-size="11.1" font-family="DejaVu Sans" font-weight="700">Examine Pragas e Jaulas</text>
<text x="68" y="413.0" fill="#F4EEE3" font-size="9.1" font-family="DejaVu Sans" font-weight="400">O que drena, influencia ou restringe seu movimento?</text>
<text x="68" y="425.0" fill="#C6BCA9" font-size="7.5" font-family="DejaVu Sans" font-weight="400">Cap. 17–21</text>
<line x1="30" y1="412" x2="30" y2="426" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="30" y1="426" x2="27.386563855346704" y2="421.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="30" y1="426" x2="32.61343614465329" y2="421.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<rect x="54" y="440" width="348" height="54" rx="5" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<circle cx="30" cy="460" r="13" fill="#32191D" stroke="#E2BD78"/>
<text x="23" y="464.0" fill="#E2BD78" font-size="9" font-family="DejaVu Sans" font-weight="700">VI</text>
<text x="68" y="459.0" fill="#E2BD78" font-size="11.1" font-family="DejaVu Sans" font-weight="700">Suba ao Mirante e filtre</text>
<text x="68" y="475.0" fill="#F4EEE3" font-size="9.1" font-family="DejaVu Sans" font-weight="400">Como chegou à conclusão? O que a contradiz?</text>
<text x="68" y="487.0" fill="#C6BCA9" font-size="7.5" font-family="DejaVu Sans" font-weight="400">Cap. 22–24</text>
<line x1="30" y1="474" x2="30" y2="488" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="30" y1="488" x2="27.386563855346704" y2="483.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="30" y1="488" x2="32.61343614465329" y2="483.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<rect x="54" y="502" width="348" height="54" rx="5" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<circle cx="30" cy="522" r="13" fill="#32191D" stroke="#E2BD78"/>
<text x="19" y="526.0" fill="#E2BD78" font-size="9" font-family="DejaVu Sans" font-weight="700">VII</text>
<text x="68" y="521.0" fill="#E2BD78" font-size="11.1" font-family="DejaVu Sans" font-weight="700">Pode, plante e sustente</text>
<text x="68" y="537.0" fill="#F4EEE3" font-size="9.1" font-family="DejaVu Sans" font-weight="400">Qual passo cabe agora? Que frutos precisa rever?</text>
<text x="68" y="549.0" fill="#C6BCA9" font-size="7.5" font-family="DejaVu Sans" font-weight="400">Cap. 25–28</text>
<text x="30" y="582.0" fill="#F4EEE3" font-size="10" font-family="DejaVu Sans" font-weight="400">O mapa orienta a leitura. A aplicação permite voltar,</text>
<text x="30" y="595.0" fill="#F4EEE3" font-size="10" font-family="DejaVu Sans" font-weight="400">rever hipóteses e preservar aquilo que já funciona.</text>
<line x1="30" y1="609" x2="402" y2="609" stroke="#725936" stroke-width="0.6"/>
<text x="30" y="626.0" fill="#C6BCA9" font-size="8" font-family="DejaVu Sans" font-weight="400">Reposicione-se · Livro completo, com apoio do Workbook.</text>
</svg>