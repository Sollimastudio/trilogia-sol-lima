<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 432 648" width="1800" height="2700">
<title>Três comandos para pensar</title>
<desc>Do automático ao exame consciente.</desc>
<rect x="0" y="0" width="432" height="648" rx="0" fill="#101010" stroke="none" stroke-width=".7"/>
<text x="30" y="29.0" fill="#E2BD78" font-size="8.1" font-family="DejaVu Sans" font-weight="700">MÉTODO POSICIONE-SE · SOL LIMA</text>
<text x="30" y="65.0" fill="#E2BD78" font-size="25" font-family="DejaVu Serif" font-weight="400">Três comandos para pensar</text>
<text x="30" y="84.0" fill="#C6BCA9" font-size="10.1" font-family="DejaVu Sans" font-weight="400">Do automático ao exame consciente.</text>
<line x1="30" y1="110" x2="402" y2="110" stroke="#725936" stroke-width="0.7"/>
<rect x="30" y="136" width="372" height="90" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="43" y="157.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">PENSE NISSO</text>
<text x="43" y="174.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Observe e nomeie fato, emoção e pensamento antes da resposta</text>
<text x="43" y="186.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">automática.</text>
<line x1="216" y1="226" x2="216" y2="251" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="251" x2="213.3865638553467" y2="246.73737738970246" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="251" x2="218.6134361446533" y2="246.73737738970246" stroke="#E2BD78" stroke-width="1.1"/>
<rect x="30" y="251" width="372" height="90" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="43" y="272.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">REPENSE ISSO</text>
<text x="43" y="289.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Examine interpretação, evidência, contraditório e alternativas.</text>
<line x1="216" y1="341" x2="216" y2="366" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="366" x2="213.3865638553467" y2="361.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="216" y1="366" x2="218.6134361446533" y2="361.7373773897025" stroke="#E2BD78" stroke-width="1.1"/>
<rect x="30" y="366" width="372" height="90" rx="6" fill="#32191D" stroke="#725936" stroke-width=".7"/>
<text x="43" y="387.0" fill="#E2BD78" font-size="11.2" font-family="DejaVu Sans" font-weight="700">PENSE COMIGO</text>
<text x="43" y="404.0" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">Acompanhe e teste o raciocínio: razão, emoção, contexto e</text>
<text x="43" y="416.5" fill="#F4EEE3" font-size="9.4" font-family="DejaVu Sans" font-weight="400">consequência.</text>
<text x="30" y="508.0" fill="#E2BD78" font-size="12" font-family="DejaVu Sans" font-weight="700">Pensar comigo não exige concordar comigo.</text>
<text x="30" y="540" fill="#F4EEE3" font-size="10" font-family="DejaVu Sans" font-weight="400">O exercício é examinar como a conclusão foi construída.</text>
<text x="30" y="554" fill="#F4EEE3" font-size="10" font-family="DejaVu Sans" font-weight="400">Depois, desça da Árvore: escolha uma ação possível</text>
<text x="30" y="568" fill="#F4EEE3" font-size="10" font-family="DejaVu Sans" font-weight="400">e volte para observar os frutos.</text>
<line x1="30" y1="609" x2="402" y2="609" stroke="#725936" stroke-width="0.6"/>
<text x="30" y="626.0" fill="#C6BCA9" font-size="8" font-family="DejaVu Sans" font-weight="400">Pense nisso: observe. Repense isso: examine. Pense comigo: teste.</text>
</svg>