<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 432 648" width="1800" height="2700">
<title>Pragas e ambiência</title>
<desc>Observe o dano localizado antes de procurar a causa.</desc>
<rect x="0" y="0" width="432" height="648" rx="0" fill="#101010" stroke="none" stroke-width=".7"/>
<text x="30" y="29.0" fill="#E2BD78" font-size="8.1" font-family="DejaVu Sans" font-weight="700">MÉTODO POSICIONE-SE · SOL LIMA</text>
<text x="30" y="65.0" fill="#E2BD78" font-size="25" font-family="DejaVu Serif" font-weight="400">Pragas e ambiência</text>
<text x="30" y="84.0" fill="#C6BCA9" font-size="10.1" font-family="DejaVu Sans" font-weight="400">Observe o dano localizado antes de procurar a causa.</text>
<line x1="30" y1="110" x2="402" y2="110" stroke="#725936" stroke-width="0.7"/>
<image x="65.0" y="122.0" width="220.0" height="330.0" xlink:href="../ARTES/pragas_cor.png"/>
<text x="282" y="153.0" fill="#E2BD78" font-size="8.7" font-family="DejaVu Sans" font-weight="700">GALHO AFETADO</text>
<text x="290" y="171" fill="#F4EEE3" font-size="8.4" font-family="DejaVu Sans" font-weight="400">Folhas danificadas;</text>
<text x="290" y="183" fill="#F4EEE3" font-size="8.4" font-family="DejaVu Sans" font-weight="400">o restante da árvore</text>
<text x="290" y="195" fill="#F4EEE3" font-size="8.4" font-family="DejaVu Sans" font-weight="400">segue preservado.</text>
<line x1="315" y1="205" x2="260" y2="231" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="260" y1="231" x2="262.7367895462711" y2="226.81550684318623" stroke="#E2BD78" stroke-width="1.1"/>
<line x1="260" y1="231" x2="264.9706482228258" y2="231.54097712051342" stroke="#E2BD78" stroke-width="1.1"/>
<text x="30" y="481.0" fill="#E2BD78" font-size="12" font-family="DejaVu Sans" font-weight="700">Pessoas não são pragas.</text>
<text x="30" y="510" fill="#F4EEE3" font-size="9.8" font-family="DejaVu Sans" font-weight="400">No método, investigue a conduta, a pressão ou o mecanismo</text>
<text x="30" y="524" fill="#F4EEE3" font-size="9.8" font-family="DejaVu Sans" font-weight="400">que drena. Considere o contexto do outro, converse quando</text>
<text x="30" y="538" fill="#F4EEE3" font-size="9.8" font-family="DejaVu Sans" font-weight="400">possível e estabeleça acordos e limites proporcionais.</text>
<text x="30" y="583.0" fill="#E2BD78" font-size="9.3" font-family="DejaVu Sans" font-weight="400">O desenho ilustra um caso; nem todo problema é externo.</text>
<line x1="30" y1="609" x2="402" y2="609" stroke="#725936" stroke-width="0.6"/>
<text x="30" y="626.0" fill="#C6BCA9" font-size="8" font-family="DejaVu Sans" font-weight="400">Empatia, proteção e responsabilidade podem caminhar juntas.</text>
</svg>