<text x="30" y="478.0" fill="#E2BD78" font-size="13" font-family="DejaVu Sans" font-weight="700">Em que você tem colocado sua atenção?</text>
<text x="30" y="511" fill="#F4EEE3" font-size="10.3" font-family="DejaVu Sans" font-weight="400">Esta inspiração orienta a reflexão da autora.</text>
<text x="30" y="526" fill="#F4EEE3" font-size="10.3" font-family="DejaVu Sans" font-weight="400">Na aplicação do método, use também as doze perguntas</text>
<text x="30" y="541" fill="#F4EEE3" font-size="10.3" font-family="DejaVu Sans" font-weight="400">do Filtro: fatos, evidências, responsabilidades e ação.</text>
