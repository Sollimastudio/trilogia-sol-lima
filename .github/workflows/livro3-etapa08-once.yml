name: Livro 3 ETAPA 08 leitura
on:
  push:
    branches: [main]
    paths: ['.github/workflows/livro3-etapa08-once.yml']
permissions:
  contents: read
concurrency:
  group: livro3-etapa08-once
  cancel-in-progress: false
jobs:
  leitura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Exportar somente fontes editoriais e manifesto
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, subprocess, hashlib, zipfile
          roots=('00_UNIVERSO_MESTRE/','01_MORTE_EM_VIDA/','02_REPOSICIONE_SE/','03_ANATOMIA_DO_DESAPARECIMENTO_DO_EU/')
          entries={}
          with zipfile.ZipFile('livro3-etapa08-base.zip','w',zipfile.ZIP_DEFLATED) as z:
              paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
              for s in paths:
                  p=Path(s)
                  if not s or not p.is_file(): continue
                  if s=='START_HERE.md' or (s.startswith(roots) and p.suffix.lower() in ('.md','.txt','.json','.patch','.csv')):
                      b=p.read_bytes(); sha=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
                      z.writestr(s,b); entries[s]={'git_blob':sha,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
              z.writestr('BASE_MANIFEST.json',json.dumps(entries,ensure_ascii=False,indent=2))
              z.writestr('BASE_COMMIT.txt',subprocess.check_output(['git','rev-parse','HEAD']))
          print('Fontes exportadas:',len(entries))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: livro3-etapa08-base
          path: livro3-etapa08-base.zip
          retention-days: 7
