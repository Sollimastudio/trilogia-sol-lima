name: Arquivar tratado TI01 autorizado
on:
  push:
    branches: [main]
    paths: ['.github/workflows/arquivar-tratado-ti01.yml']
permissions:
  contents: write
jobs:
  arquivar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Transferir arquivo autorizado e validar integridade
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, hashlib, io, zipfile, pathlib, json
          url='https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-0ee4-820e-8b5f-eecd23890d9b/raw?se=2026-09-26T14%3A31%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=2740f470-a39e-5e32-b1cd-ecb44f532cf5&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T11%3A27%3A19Z&ske=2026-09-27T11%3A27%3A19Z&sks=b&skv=2026-02-06&sig=MsJB2LuxW/W%2BcVmBl9I1wWh9DrbRKK/w0%2BirdFJgAOE%3D'
          print('::add-mask::'+url,flush=True)
          try:
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(request,timeout=30) as response: data=response.read(2000000)
          except Exception as exc:
              print('Falha de transporte:',type(exc).__name__,getattr(exc,'code',None),str(getattr(exc,'reason',''))[:180])
              raise SystemExit(1)
          assert hashlib.sha256(data).hexdigest()=='c0b6a9cc84ebab0010bfd352ea5a5c766ddb7b9921890435d57994f74d1394df'
          folder=pathlib.Path('00_UNIVERSO_MESTRE/TRATADO_INTEGRADO/TI01_2026-09-26')
          folder.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert archive.testzip() is None
              for entry in archive.infolist():
                  assert len(pathlib.PurePosixPath(entry.filename).parts)==1
                  body=archive.read(entry.filename)
                  relative=('HISTORICO_CONVERSAO/' if entry.filename in ('LEIA_PRIMEIRO_TI01.md','VERIFICACAO_TI01.json') else '')+entry.filename
                  path=folder/relative
                  assert not path.exists() or path.read_bytes()==body
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(body)
          verification=json.loads((folder/'HISTORICO_CONVERSAO/VERIFICACAO_TI01.json').read_text())
          for name,digest in verification['sha256'].items(): assert hashlib.sha256((folder/name).read_bytes()).hexdigest()==digest
          (folder/'Tratado_Integrado_TI01_PDF_e_Fontes_2026-09-26.zip').write_bytes(data)
          print('Conteudo original recuperado e hashes confirmados.')
          PY
      - name: Gravar entrega
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 00_UNIVERSO_MESTRE/TRATADO_INTEGRADO/TI01_2026-09-26/
          git commit -m 'docs: tratado TI01 integral autorizado por Sol Lima'
          git push origin HEAD:main
