name: Fuga ETAPA 08 conferencia pontual
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fuga-etapa08-conferencia-pontual.yml']
permissions:
  contents: read
jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Exportar documentos rastreados e manifesto sem credenciais
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, hashlib, json
          out=Path('exportacao-etapa08')
          out.mkdir()
          allowed=('00_UNIVERSO_MESTRE/','01_MORTE_EM_VIDA/','02_REPOSICIONE_SE/','03_ANATOMIA_DO_DESAPARECIMENTO_DO_EU/')
          rows=[]
          for n in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              if not n or not (n.startswith(allowed) or n in ('START_HERE.md','README.md')): continue
              p=Path(n)
              if p.is_symlink() or p.suffix.lower() not in ('.md','.txt','.json','.csv','.patch','.py','.html','.css'): continue
              b=p.read_bytes(); q=out/p; q.parent.mkdir(parents=True,exist_ok=True); q.write_bytes(b)
              rows.append({'path':n,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (out/'MANIFESTO_RECUPERACAO.json').write_text(json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'files':rows},ensure_ascii=False,indent=2),encoding='utf-8')
          print(len(rows),'arquivos; exportacao sem alteracao editorial')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: fuga-etapa08-conferencia
          path: exportacao-etapa08/
          retention-days: 3
          if-no-files-found: error
