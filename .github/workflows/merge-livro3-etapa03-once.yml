name: Merge Livro 3 ETAPA 03 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/merge-livro3-etapa03-once.yml'

permissions:
  contents: write

jobs:
  merge-manuscript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fuse ETAPA 02 and Parte II safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('03_ANATOMIA_DO_DESAPARECIMENTO_DO_EU')
          manuscript = root / 'MANUSCRITO_CANONICO.md'
          block = root / 'ETAPAS' / '03_PARTE_II_BLOCO_PRODUCAO_2026-09-10.md'
          snapshot = root / 'ETAPAS' / '03_PARTE_II_ESPELHOS_2026-09-10.md'

          base = manuscript.read_text(encoding='utf-8')
          addition = block.read_text(encoding='utf-8').strip()

          base = base.replace(
              '**Estado:** manuscrito canônico vivo — ETAPA 02',
              '**Estado:** manuscrito canônico vivo — ETAPA 03',
              1,
          )
          base = base.replace(
              '**Data de consolidação desta etapa:** 10/09/2026',
              '**Data de consolidação desta etapa:** 10/09/2026',
              1,
          )

          marker = '# PARTE II — OS ESPELHOS QUE RESPONDEM POR NÓS'
          if marker not in base:
              base = base.rstrip() + '\n\n---\n\n' + addition + '\n'

          manuscript.write_text(base, encoding='utf-8')
          snapshot.write_text(base, encoding='utf-8')

          if manuscript.read_text(encoding='utf-8') != snapshot.read_text(encoding='utf-8'):
              raise SystemExit('Snapshot divergiu do manuscrito fundido')
          if '# CAPÍTULO 1' not in base or '# CAPÍTULO 8' not in base:
              raise SystemExit('Integridade estrutural falhou: capítulos 1–8 não encontrados')
          PY

      - name: Commit fused manuscript and immutable snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 03_ANATOMIA_DO_DESAPARECIMENTO_DO_EU/MANUSCRITO_CANONICO.md
          git add 03_ANATOMIA_DO_DESAPARECIMENTO_DO_EU/ETAPAS/03_PARTE_II_ESPELHOS_2026-09-10.md
          git rm .github/workflows/merge-livro3-etapa03-once.yml
          git commit -m "Livro 3: funde Parte II e congela snapshot da ETAPA 03"
          git push