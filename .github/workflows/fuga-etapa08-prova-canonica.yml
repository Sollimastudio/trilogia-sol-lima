name: Fuga ETAPA 08 prova canonica
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fuga-etapa08-prova-canonica.yml'
      - '03_ANATOMIA_DO_DESAPARECIMENTO_DO_EU/MANUSCRITO_CANONICO.md'
permissions:
  contents: read
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar gerador e verificador
        run: pip install reportlab pypdf
      - name: Gerar prova diretamente do canone
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, subprocess
          from reportlab.lib.pagesizes import A5
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib.enums import TA_CENTER
          from reportlab.lib.units import mm
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, PageBreak
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.pdfbase import pdfmetrics
          from pypdf import PdfReader

          src=Path('03_ANATOMIA_DO_DESAPARECIMENTO_DO_EU/MANUSCRITO_CANONICO.md')
          out=Path('exportacao-etapa08-canonica'); out.mkdir()
          raw=src.read_bytes(); text=raw.decode('utf-8')
          (out/'MANUSCRITO_CANONICO.md').write_bytes(raw)

          for name,path in [('NotoSans','/usr/share/fonts/truetype/noto/NotoSans-Regular.ttf'),('NotoSansBold','/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf')]:
              if Path(path).exists(): pdfmetrics.registerFont(TTFont(name,path))
          base='NotoSans' if 'NotoSans' in pdfmetrics.getRegisteredFontNames() else 'Helvetica'
          bold='NotoSansBold' if 'NotoSansBold' in pdfmetrics.getRegisteredFontNames() else 'Helvetica-Bold'
          styles=getSampleStyleSheet()
          body=ParagraphStyle('body',fontName=base,fontSize=9.2,leading=13,spaceAfter=5)
          h1=ParagraphStyle('h1',fontName=bold,fontSize=16,leading=20,spaceBefore=8,spaceAfter=10)
          h2=ParagraphStyle('h2',fontName=bold,fontSize=13,leading=17,spaceBefore=7,spaceAfter=8)
          h3=ParagraphStyle('h3',fontName=bold,fontSize=11,leading=14,spaceBefore=6,spaceAfter=6)
          cover=ParagraphStyle('cover',fontName=bold,fontSize=18,leading=23,alignment=TA_CENTER,spaceAfter=12)
          pdf=out/'Fuga_Identitaria_ETAPA_08_Prova_Canonica.pdf'
          def footer(canvas,doc):
              canvas.saveState(); canvas.setFont(base,7.5)
              canvas.drawCentredString(A5[0]/2,8*mm,str(doc.page)); canvas.restoreState()
          doc=SimpleDocTemplate(str(pdf),pagesize=A5,rightMargin=16*mm,leftMargin=16*mm,topMargin=17*mm,bottomMargin=15*mm,
                                title='Fuga Identitaria - ETAPA 08 - Prova Canonica',author='Sol Lima')
          story=[Paragraph('FUGA IDENTITÁRIA',cover),Paragraph('Anatomia do Desaparecimento do Eu',h2),
                 Spacer(1,8*mm),Paragraph('PROVA CANÔNICA - ETAPA 08',h2),
                 Paragraph('Gerada automaticamente a partir de MANUSCRITO_CANONICO.md. Prova editorial; não equivale a autorização de publicação.',body),PageBreak()]
          for line in text.splitlines():
              s=line.strip()
              if not s: story.append(Spacer(1,2.2*mm)); continue
              if s=='---': story.append(Spacer(1,4*mm)); continue
              if s.startswith('# '): story.extend([PageBreak(),Paragraph(s[2:].strip(),h1)]); continue
              if s.startswith('## '): story.extend([Spacer(1,3*mm),Paragraph(s[3:].strip(),h2)]); continue
              if s.startswith('### '): story.append(Paragraph(s[4:].strip(),h3)); continue
              if s.startswith('|'): continue
              esc=(s.replace('&','&amp;').replace('<','&lt;').replace('>','&gt;'))
              esc=re.sub(r'\*\*(.+?)\*\*',r'<b>\1</b>',esc)
              esc=re.sub(r'\*(.+?)\*',r'<i>\1</i>',esc)
              story.append(Paragraph(esc,body))
          doc.build(story,onFirstPage=footer,onLaterPages=footer)
          reader=PdfReader(str(pdf))
          extracted='\n'.join((p.extract_text() or '') for p in reader.pages)
          manifest={
            'commit':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),
            'source_path':str(src),
            'source_bytes':len(raw),
            'source_git_blob':subprocess.check_output(['git','hash-object',str(src)]).decode().strip(),
            'source_sha256':hashlib.sha256(raw).hexdigest(),
            'pdf_bytes':pdf.stat().st_size,
            'pdf_sha256':hashlib.sha256(pdf.read_bytes()).hexdigest(),
            'pages':len(reader.pages),
            'replacement_character_in_pdf_text':'�' in extracted,
            'figures_incorporated':False,
            'proof_scope':'prova textual canonica; figuras permanecem em curadoria editorial separada'
          }
          (out/'MANIFESTO_PROVA_CANONICA.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fuga-etapa08-prova-canonica
          path: exportacao-etapa08-canonica/
          retention-days: 7
          if-no-files-found: error
