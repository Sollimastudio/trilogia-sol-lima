name: Livro 3 ETAPA 04 consolidacao verificada
on:
  push:
    branches: [main]
    paths: ['.github/workflows/livro3-etapa04-once.yml']
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Conferir base, revisar e consolidar
        run: python 03_ANATOMIA_DO_DESAPARECIMENTO_DO_EU/PRODUCAO_ETAPA_04/consolidar_etapa04.py
      - name: Versionar somente a frente do Livro 3
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 03_ANATOMIA_DO_DESAPARECIMENTO_DO_EU
          if git diff --cached --quiet; then
            echo 'Nenhuma alteracao a versionar; interrompendo.'
            exit 1
          fi
          git commit -m 'Livro 3 ETAPA 04: integra Parte III, revisa conjunto e preserva snapshot integral'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Conferir integridade e exportar entrega do Livro 3
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('03_ANATOMIA_DO_DESAPARECIMENTO_DO_EU')
          qa = json.loads((root/'QA_ETAPA_04.json').read_text())
          manuscript = (root/'MANUSCRITO_CANONICO.md').read_bytes()
          snapshot = (root/qa['snapshot']).read_bytes()
          assert manuscript == snapshot
          assert hashlib.sha256(manuscript).hexdigest() == qa['sha256_manuscrito_e_snapshot']
          for name, digest in qa['snapshots_anteriores_sha256'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest() == digest
          print('Manuscrito, snapshot e todos os marcos anteriores conferidos.')
          PY
          mkdir -p /tmp/livro3-etapa04-entrega
          cp -R 03_ANATOMIA_DO_DESAPARECIMENTO_DO_EU /tmp/livro3-etapa04-entrega/
          git rev-parse HEAD > /tmp/livro3-etapa04-entrega/COMMIT_ENTREGA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: livro3-etapa04-consolidado
          path: /tmp/livro3-etapa04-entrega/
          retention-days: 7
