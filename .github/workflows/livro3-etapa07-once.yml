name: Livro 3 ETAPA 07 consolidacao verificada
on:
  push:
    branches: [main]
    paths: ['.github/workflows/livro3-etapa07-once.yml']
permissions:
  contents: write
concurrency:
  group: livro3-etapa07
  cancel-in-progress: false
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Consolidar somente sobre a base conferida e salvar o marco
        run: |
          set -euo pipefail
          python3 03_ANATOMIA_DO_DESAPARECIMENTO_DO_EU/PRODUCAO_ETAPA_07/consolidar_etapa07.py > /tmp/qa-etapa07.json
          if git diff --name-only | grep -v '^03_ANATOMIA_DO_DESAPARECIMENTO_DO_EU/' | grep -q .; then
            echo 'Mudança fora da pasta autorizada; interrompido.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 03_ANATOMIA_DO_DESAPARECIMENTO_DO_EU/
          if git diff --cached --quiet; then
            echo 'Nenhuma nova integração; não declarar conclusão.'
            exit 1
          fi
          git commit -m 'Livro 3 ETAPA 07: integra Parte VI e epílogo, revisão e snapshot verificado'
          git push origin HEAD:main
          mkdir -p /tmp/livro3-etapa07-consolidado
          cp -R 03_ANATOMIA_DO_DESAPARECIMENTO_DO_EU /tmp/livro3-etapa07-consolidado/
          git rev-parse HEAD > /tmp/livro3-etapa07-consolidado/COMMIT_INTEGRACAO.txt
          git rev-parse HEAD^ > /tmp/livro3-etapa07-consolidado/COMMIT_BASE.txt
          git show --format= --name-only HEAD > /tmp/livro3-etapa07-consolidado/ARQUIVOS_COMMIT.txt
          cp /tmp/qa-etapa07.json /tmp/livro3-etapa07-consolidado/QA_EXECUCAO.json
      - uses: actions/upload-artifact@v4
        with:
          name: livro3-etapa07-consolidado
          path: /tmp/livro3-etapa07-consolidado/
          retention-days: 7
