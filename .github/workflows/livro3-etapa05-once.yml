name: Livro 3 ETAPA 05 consolidacao verificada
on:
  push:
    branches: [main]
    paths: ['.github/workflows/livro3-etapa05-once.yml']
permissions:
  contents: write
concurrency:
  group: livro3-etapa05-once
  cancel-in-progress: false
jobs:
  consolidar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Conferir base, integrar e validar antes de versionar
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python 03_ANATOMIA_DO_DESAPARECIMENTO_DO_EU/PRODUCAO_ETAPA_05/consolidar_etapa05.py
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          prefix='03_ANATOMIA_DO_DESAPARECIMENTO_DO_EU/'
          names=json.loads(Path(prefix+'ARQUIVOS_INTEGRACAO_ETAPA_05.json').read_text())
          assert all(not n.startswith('/') and '..' not in Path(n).parts for n in names)
          subprocess.run(['git','add','--']+[prefix+n for n in names],check=True)
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert staged and all(n.startswith(prefix) and n[len(prefix):] in names for n in staged), staged
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Livro 3 ETAPA 05: Parte IV integral revisada, referencias e snapshot verificado'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PY
      - name: Recuperar o marco salvo e preparar arquivo de verificacao
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          mkdir -p /tmp/livro3-etapa05-final
          cp -R 03_ANATOMIA_DO_DESAPARECIMENTO_DO_EU /tmp/livro3-etapa05-final/
          git rev-parse HEAD > /tmp/livro3-etapa05-final/COMMIT_INTEGRACAO.txt
          git diff --stat HEAD^ HEAD > /tmp/livro3-etapa05-final/RESUMO_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: livro3-etapa05-consolidado
          path: /tmp/livro3-etapa05-final/
          retention-days: 7
